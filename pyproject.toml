[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "live_llm: requires an explicitly enabled local or remote model and may incur cost",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
# These are deliberately malformed workflow fixtures, not repository source.
extend-exclude = [
    "tests/workflows",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "C4"]

[tool.mypy]
python_version = "3.10"
files = [
    "askme.py",
    "tests/_test_support.py",
    "tests/bench_harness.py",
    "tests/ci_llm_gate.py",
    "tests/workflow_eval.py",
    "tests/featurebench/askme_adapter.py",
    "tests/featurebench/canary_audit.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["askme"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
