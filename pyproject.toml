[project]
name = "askme"
version = "0.1.0"
description = "A minimal coding-agent harness for constrained local LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.1,<0.17",
    "ty==0.0.65",
    "types-requests>=2.33.0.20260712",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "live_llm: requires an explicitly enabled local or remote model and may incur cost",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
# These are deliberately malformed workflow fixtures, not repository source.
extend-exclude = [
    "tests/workflows",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "C4"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = [
    "askme.py",
    "tests/_test_support.py",
    "tests/bench_harness.py",
    "tests/ci_llm_gate.py",
    "tests/workflow_eval.py",
    "tests/featurebench/askme_adapter.py",
    "tests/featurebench/canary_audit.py",
]

[tool.coverage.run]
branch = true
source = ["askme"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
