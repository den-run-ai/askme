name: LLM Tests

# Live-model tests against OpenRouter. These spend real (tiny) OpenRouter
# credits — the measured Berkeley smoke matrix cost ~$0.012 total — so the
# workflow only runs when explicitly wanted:
#   - push to main touching agent/test code (the stochastic Berkeley-derived
#     task smoke is advisory; the easy smoke job still gates)
#   - weekly schedule (exact served-model and evidence-contract drift check;
#     provider routing remains automatic unless manually pinned)
#   - manual dispatch, with strict suite/model-cell/provider/trial overrides
#   - pull requests only when labeled 'llm-tests' AND from a same-repo
#     branch — the job guards reject fork PRs before any credential is in
#     scope (secrets are withheld from forks by GitHub)
#
# The credential comes from the repository's "Openrouter" deployment
# environment, stored as an environment *secret* named OPENROUTER_API_KEY.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Pytest suite for the smoke job
        type: choice
        options: [easy, medium, hard]
        default: easy
      models:
        description: >-
          Comma-separated requested=expected-served model cells for the
          Berkeley-derived task smoke. Append '@low', '@medium', or '@high' to a complete cell to pin a
          baseline reasoning effort (for example
          openai/gpt-oss-20b=openai/gpt-oss-20b@low).
        type: string
        default: google/gemma-4-26b-a4b-it=google/gemma-4-26b-a4b-it-20260403,qwen/qwen3.6-27b=qwen/qwen3.6-27b-20260422
      provider:
        description: OpenRouter provider slug ('auto' = automatic routing)
        type: string
        default: auto
      trials:
        description: Trials per Berkeley-derived smoke cell
        type: string
        default: "1"
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  push:
    branches: [main]
    paths:
      - askme.py
      - tests/**
      - .github/workflows/llm.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openrouter-smoke:
    # PRs opt in via the 'llm-tests' label and must come from a same-repo
    # branch: a labeled fork PR would otherwise run fork-controlled code
    # with the credential in scope.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'llm-tests'))
    runs-on: ubuntu-latest
    environment: Openrouter
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Preflight OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python tests/ci_llm_gate.py preflight
      - name: Run OpenRouter ${{ inputs.suite || 'easy' }} suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Automatic routing: this checks the loop, not one provider's uptime.
          OPENROUTER_PROVIDER: ""
          AGENT_RUN_LOG: ${{ github.workspace }}/llm-logs/smoke.jsonl
          ASKME_RUN_LIVE_LLM_TESTS: "1"
          SUITE: ${{ inputs.suite || 'easy' }}
        run: |
          mkdir -p llm-logs
          case "$SUITE" in
            easy)   K="TestOpenRouterEasy" ;;
            medium) K="TestOpenRouterMedium" ;;
            hard)   K="TestOpenRouterHard" ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac
          uv run --locked pytest tests/test_agent_integration.py -s -v -rs -m live_llm -k "$K"
      - name: Assert the suite really ran (no silent skips)
        run: test -s llm-logs/smoke.jsonl
      - name: Upload agent run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrouter-smoke-logs
          path: llm-logs/
          if-no-files-found: warn
          retention-days: 14

  berkeley-protocol:
    # Legacy job ID retained for workflow compatibility. This runs the two task
    # selectors used by the Berkeley talk on current code and current model
    # cells; it is not a replay of the frozen four-model, strict-SiliconFlow
    # historical matrix in talks/berkeley-agentic-ai-summit-2026/evals/README.md.
    # The report requires pytest pass + agent complete for every valid trial.
    # A valid one-trial live-model result rejection is advisory on post-merge
    # main pushes, but evidence-integrity failures remain blocking everywhere.
    # Cell results stay strict for scheduled drift checks, manual runs, and PRs.
    # Same guard as openrouter-smoke: label opt-in AND same-repo head only.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'llm-tests'))
    runs-on: ubuntu-latest
    environment: Openrouter
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Preflight OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python tests/ci_llm_gate.py preflight
      - name: Run Berkeley protocol cells
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELS: ${{ inputs.models || 'google/gemma-4-26b-a4b-it=google/gemma-4-26b-a4b-it-20260403,qwen/qwen3.6-27b=qwen/qwen3.6-27b-20260422' }}
          PROVIDER: ${{ inputs.provider || 'auto' }}
          TRIALS: ${{ inputs.trials || '1' }}
          BENCH_ROOT: ${{ runner.temp }}/askme-bench-logs
        run: |
          # Valid negative outcomes return zero so the report step can apply
          # strict/advisory policy. A nonzero harness result is invalid evidence
          # and deliberately stops this step before any later cell can qualify.
          set -u
          MODEL_COUNT=0
          IFS=',' read -ra MODEL_LIST <<< "$MODELS"
          for MODEL in "${MODEL_LIST[@]}"; do
            MODEL="$(printf '%s' "$MODEL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$MODEL" ] && continue
            # A cell is requested=expected-served, with an optional '@effort'
            # suffix for always-on reasoners:
            # 'openai/gpt-oss-20b=openai/gpt-oss-20b@low'.
            EFFORT=""
            case "$MODEL" in
              *@*) EFFORT="${MODEL##*@}"; MODEL="${MODEL%@*}" ;;
            esac
            case "$EFFORT" in
              ""|low|medium|high) ;;
              *) echo "invalid reasoning effort in model cell: $EFFORT" >&2; exit 1 ;;
            esac
            case "$MODEL" in
              *=*) EXPECTED_SERVED_MODEL="${MODEL#*=}"; MODEL="${MODEL%%=*}" ;;
              *) echo "model cell must use requested=expected-served syntax" >&2; exit 1 ;;
            esac
            if [ -z "$MODEL" ] || [ -z "$EXPECTED_SERVED_MODEL" ] || [[ "$EXPECTED_SERVED_MODEL" == *"="* ]]; then
              echo "model cell must contain exactly one non-empty requested=expected-served pair" >&2
              exit 1
            fi
            EFFORT_ARGS=()
            [ -n "$EFFORT" ] && EFFORT_ARGS=(--reasoning-effort "$EFFORT")
            MODEL_COUNT=$((MODEL_COUNT + 1))
            SLUG="$(printf '%s' "$MODEL-$EXPECTED_SERVED_MODEL${EFFORT:+-$EFFORT}" | tr '/.:' '---')"
            uv run --locked python tests/bench_harness.py --backend openrouter --suite hard \
              --test test_replan_build_with_dependency --trials "$TRIALS" \
              --model "$MODEL" --provider "$PROVIDER" "${EFFORT_ARGS[@]}" \
              --reasoning-policy gated \
              --capability-profile generic-feature-scale-v1 \
              --expected-served-model "$EXPECTED_SERVED_MODEL" \
              --log-dir "$BENCH_ROOT/$SLUG/build"
            uv run --locked python tests/bench_harness.py --backend openrouter --suite medium \
              --test test_fix_python_syntax_error --trials "$TRIALS" \
              --model "$MODEL" --provider "$PROVIDER" "${EFFORT_ARGS[@]}" \
              --reasoning-policy gated \
              --capability-profile generic-feature-scale-v1 \
              --expected-served-model "$EXPECTED_SERVED_MODEL" \
              --log-dir "$BENCH_ROOT/$SLUG/repair"
          done
          echo "EXPECTED_CELLS=$((MODEL_COUNT * 2))" >> "$GITHUB_ENV"
      - name: Gate on protocol pass rule
        env:
          BENCH_ROOT: ${{ runner.temp }}/askme-bench-logs
        run: |
          ADVISORY_ARGS=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ADVISORY_ARGS=(--advisory-cell-failures)
          fi
          uv run --locked python tests/ci_llm_gate.py report "$BENCH_ROOT"/*/*/summary.json \
            --expect-cells "$EXPECTED_CELLS" --markdown-out "$GITHUB_STEP_SUMMARY" \
            "${ADVISORY_ARGS[@]}"
      - name: Upload bench logs and summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: berkeley-protocol-logs
          path: ${{ runner.temp }}/askme-bench-logs/
          if-no-files-found: warn
          retention-days: 14
