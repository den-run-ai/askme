name: LLM Tests

# Live-model tests against OpenRouter. These spend real (tiny) OpenRouter
# credits — the measured Berkeley smoke matrix cost ~$0.012 total — so the
# workflow only runs when explicitly wanted:
#   - push to main touching agent/test code (the stochastic Berkeley matrix is
#     retained as advisory evidence; the easy smoke job still gates)
#   - weekly schedule (strict provider/model drift check)
#   - manual dispatch, with strict suite/model/provider/trial overrides
#   - pull requests only when labeled 'llm-tests' AND from a same-repo
#     branch — the job guards reject fork PRs before any credential is in
#     scope (secrets are withheld from forks by GitHub)
#
# The credential comes from the repository's "Openrouter" deployment
# environment, stored as an environment *secret* named OPENROUTER_API_KEY.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Pytest suite for the smoke job
        type: choice
        options: [easy, medium, hard, web]
        default: easy
      models:
        description: >-
          Comma-separated OpenRouter model IDs for the Berkeley job. Append
          '@low', '@medium', or '@high' to pin a baseline reasoning effort for
          always-on reasoners (e.g. openai/gpt-oss-20b@low).
        type: string
        default: google/gemma-4-26b-a4b-it,qwen/qwen3.6-27b
      provider:
        description: OpenRouter provider slug ('auto' = automatic routing)
        type: string
        default: auto
      trials:
        description: Trials per Berkeley cell
        type: string
        default: "1"
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  push:
    branches: [main]
    paths:
      - askme.py
      - tests/**
      - .github/workflows/llm.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openrouter-smoke:
    # PRs opt in via the 'llm-tests' label and must come from a same-repo
    # branch: a labeled fork PR would otherwise run fork-controlled code
    # with the credential in scope.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'llm-tests'))
    runs-on: ubuntu-latest
    environment: Openrouter
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Preflight OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python tests/ci_llm_gate.py preflight
      - name: Run OpenRouter ${{ inputs.suite || 'easy' }} suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Automatic routing: this checks the loop, not one provider's uptime.
          OPENROUTER_PROVIDER: ""
          AGENT_RUN_LOG: ${{ github.workspace }}/llm-logs/smoke.jsonl
          ASKME_RUN_LIVE_LLM_TESTS: "1"
          SUITE: ${{ inputs.suite || 'easy' }}
        run: |
          mkdir -p llm-logs
          case "$SUITE" in
            easy)   K="TestOpenRouterEasy" ;;
            medium) K="TestOpenRouterMedium" ;;
            hard)   K="TestOpenRouterHard" ;;
            web)    K="TestOpenRouterWeb" ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac
          uv run --locked pytest tests/test_agent_integration.py -s -v -rs -m live_llm -k "$K"
      - name: Assert the suite really ran (no silent skips)
        run: test -s llm-logs/smoke.jsonl
      - name: Upload agent run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrouter-smoke-logs
          path: llm-logs/
          if-no-files-found: warn
          retention-days: 14

  berkeley-protocol:
    # Replays the two Berkeley talk eval cells per model — the hard build and
    # medium repair selectors from talks/berkeley-agentic-ai-summit-2026/
    # evals/README.md — through tests/bench_harness.py, then evaluates the
    # protocol's pass rule (pytest pass + agent complete for every trial).
    # A valid one-trial live-model result rejection is advisory on post-merge
    # main pushes, but evidence-integrity failures remain blocking everywhere.
    # Cell results stay strict for scheduled drift checks, manual runs, and PRs.
    # Same guard as openrouter-smoke: label opt-in AND same-repo head only.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'llm-tests'))
    runs-on: ubuntu-latest
    environment: Openrouter
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Preflight OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python tests/ci_llm_gate.py preflight
      - name: Run Berkeley protocol cells
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELS: ${{ inputs.models || 'google/gemma-4-26b-a4b-it,qwen/qwen3.6-27b' }}
          PROVIDER: ${{ inputs.provider || 'auto' }}
          TRIALS: ${{ inputs.trials || '1' }}
        run: |
          set -u
          MODEL_COUNT=0
          IFS=',' read -ra MODEL_LIST <<< "$MODELS"
          for MODEL in "${MODEL_LIST[@]}"; do
            MODEL="$(echo "$MODEL" | xargs)"
            [ -z "$MODEL" ] && continue
            # Optional '@effort' suffix pins a baseline reasoning effort for
            # always-on reasoners: 'openai/gpt-oss-20b@low'.
            EFFORT=""
            case "$MODEL" in
              *@*) EFFORT="${MODEL##*@}"; MODEL="${MODEL%@*}" ;;
            esac
            EFFORT_ARGS=()
            [ -n "$EFFORT" ] && EFFORT_ARGS=(--reasoning-effort "$EFFORT")
            MODEL_COUNT=$((MODEL_COUNT + 1))
            SLUG="$(echo "$MODEL${EFFORT:+-$EFFORT}" | tr '/.:' '---')"
            uv run --locked python tests/bench_harness.py --backend openrouter --suite hard \
              --test test_replan_build_with_dependency --trials "$TRIALS" \
              --model "$MODEL" --provider "$PROVIDER" "${EFFORT_ARGS[@]}" \
              --log-dir "bench-logs/$SLUG/build"
            uv run --locked python tests/bench_harness.py --backend openrouter --suite medium \
              --test test_fix_python_syntax_error --trials "$TRIALS" \
              --model "$MODEL" --provider "$PROVIDER" "${EFFORT_ARGS[@]}" \
              --log-dir "bench-logs/$SLUG/repair"
          done
          echo "EXPECTED_CELLS=$((MODEL_COUNT * 2))" >> "$GITHUB_ENV"
      - name: Gate on protocol pass rule
        run: |
          ADVISORY_ARGS=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ADVISORY_ARGS=(--advisory-cell-failures)
          fi
          uv run --locked python tests/ci_llm_gate.py report bench-logs/*/*/summary.json \
            --expect-cells "$EXPECTED_CELLS" --markdown-out "$GITHUB_STEP_SUMMARY" \
            "${ADVISORY_ARGS[@]}"
      - name: Upload bench logs and summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: berkeley-protocol-logs
          path: bench-logs/
          if-no-files-found: warn
          retention-days: 14
